<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ספרית היצירות</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="style.css">

<style>
  #premiumNotice[hidden] { display:none !important; }
  #premiumNotice {
    position:fixed; z-index:99999; top:12px; left:50%; transform:translateX(-50%);
    width:max-content; max-width:calc(100vw - 24px); box-sizing:border-box;
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:#fffaf0; border:1px solid #dfc77e; border-radius:8px;
    box-shadow:0 3px 12px rgba(0,0,0,.2); color:#303030;
    font:18px/1.45 Arial,sans-serif; text-align:right; direction:rtl;
  }
  #premiumNoticeText { display:flex; flex-direction:column; }
  #premiumNoticeText span { display:block; }
  @media (max-width:600px) { #premiumNotice {font-size:16px; padding:10px;} }
  #premiumNoticeClose { flex:0 0 auto; border:0; background:transparent; color:#444; font-size:25px; line-height:1; cursor:pointer; padding:0 3px; }
  #premiumNoticeClose:focus-visible {outline:2px solid #24589b; outline-offset:2px;}
</style>
</head>

<body>

<div id="premiumNotice" class="premium-notice" role="status" aria-live="polite">
    <span id="premiumNoticeText"><span>יש לך חשבון YouTube Premium?</span><span> התחברו לחשבון גם בדפדפן של הנגן.</span><span>כדי להפחית את הפרסומות.</span></span>
    <button id="premiumNoticeClose" type="button" aria-label="סגור הודעה" title="סגור">×</button>
</div>

<script>
(function () {
  var notice = document.getElementById('premiumNotice');
  var close = document.getElementById('premiumNoticeClose');
  if (!notice || !close) return;
  notice.hidden = false;
  function dismiss() { notice.hidden = true; }
  close.addEventListener('click', dismiss);
  window.setTimeout(dismiss, 10000);
})();
</script>

<div class="container">

    <!-- אזור הנגן -->

    <section class="video-panel">

        <div class="player-title-row">
            <label class="work-selector-control" for="workSelector">
              בחר יצירה
              <select id="workSelector" aria-label="בחר יצירה"></select>
            </label>
            <h2 id="libraryTitle">
                ספרית היצירות
            </h2>

            <label class="playback-speed-control" for="playbackSpeedRange">
              <span>מהירות</span>
              <input
                type="range"
                id="playbackSpeedRange"
                min="0.5"
                max="2"
                step="0.1"
                value="1">
              <span id="playbackSpeedValue" class="playback-speed-value">1.0×</span>
            </label>
        </div>

        <!-- מוצג רק בנייד -->

        <button id="backToMenuBtn"
                class="mobile-only"
                onclick="showMobileMenu()">
            חזרה לבחירת קטעים
        </button>

        <div class="video-wrapper"
             id="videoWrapper">

            <div id="player"></div>

        </div>
        <div class="player-toolbar">

            <div id="currentTitle">
                בחר קול ולאחר מכן בחר קטע
            </div>

            <div id="jumpToTimeContainer" class="jump-to-time">
                <input
                    type="text"
                    id="jumpToTimeInput"
                    placeholder="1:05"
                    title="דקה:שניה או שעה:דקה:שניה">

                <button id="jumpToTimeBtn">
                    דלג
                </button>
            </div>

            <div id="skipButtons"
                 class="skip-buttons"
                 aria-label="כפתורי דילוג בנגן">
            </div>

        </div>


    </section>

    <!-- אזור הכפתורים -->

    <section class="buttons-panel">

        <div class="groups-title-row">
          <h3>קולות</h3>

          <div class="playback-options" aria-label="אפשרויות נגינה">
            <label>
              <input type="checkbox" id="playAllCheckbox">
              נגן הכל ברצף
            </label>

            <label>
              <input type="checkbox" id="repeatSegmentCheckbox">
              חזור על הקטע
            </label>
          </div>

          <button id="openFullBtn" type="button">
            פתח במסך מלא
          </button>
        </div>

        <div id="groupButtons"
             class="group-buttons">
        </div>

        <div id="groupButtons2"
             class="group-buttons second-row">
        </div>

        <h3 id="segmentsTitle">בחר קול</h3>

        <div id="segmentButtons">
        </div>

    </section>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script src="app.js"></script>

</body>

</html>
